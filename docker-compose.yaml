services:
  app:
    build:
      context: .
    ports:
      - '8080:80'
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nourasync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: nourasync_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nourasync -d nourasync_db']
      interval: 3s
      timeout: 5s
      retries: 20

  nourasync:
    build:
      context: .
      dockerfile: packages/noura-sync-server/Dockerfile
    command:
      - sh
      - -c
      - bun run --cwd packages/noura-sync-server db:migrate && exec bun run --cwd packages/noura-sync-server start
    restart: unless-stopped
    ports:
      - '1900:1900'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 1900
      TEST_MODE: ${TEST_MODE:-false}
      TEST_MODE_CONFIRM: ${TEST_MODE_CONFIRM:-}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DATABASE_URL: postgresql://nourasync:${POSTGRES_PASSWORD:-change-me}@db:5432/nourasync_db

volumes:
  db_data:
