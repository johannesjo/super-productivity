name: SuperSync Server Tests

on:
  pull_request:
    paths:
      - 'packages/super-sync-server/**'
      - 'packages/shared-schema/**'
      - 'packages/sync-core/**'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supersync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supersync
          POSTGRES_PASSWORD: superpassword
          POSTGRES_DB: supersync_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U supersync -d supersync_db"
          --health-interval 3s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://supersync:superpassword@localhost:5432/supersync_db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:supersync
      - working-directory: packages/super-sync-server
        run: bunx prisma db push --skip-generate
      - working-directory: packages/super-sync-server
        run: bun run test:integration:postgres
