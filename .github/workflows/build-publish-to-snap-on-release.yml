name: Publish to snap store on release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish to edge and stable
        required: true
        type: string

permissions:
  contents: read

jobs:
  snap-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    steps:
      # Only needed for the local composite action below.
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download release snap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/snap-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'superProductivity-*.snap' \
            --dir .tmp/snap-release

          SNAP_COUNT=$(find .tmp/snap-release -maxdepth 1 -type f -name '*.snap' | wc -l | tr -d '[:space:]')
          if [ "$SNAP_COUNT" != "1" ]; then
            echo "Expected exactly one snap asset for $RELEASE_TAG, found $SNAP_COUNT"
            find .tmp/snap-release -maxdepth 1 -type f -print
            exit 1
          fi

          mv .tmp/snap-release/*.snap .tmp/snap-release/sp.snap

      # Runs snapcraft from Canonical's official container so we don't depend on
      # `sudo snap install snapcraft --classic` working on the runner, which has
      # been a recurring source of "unable to contact snap store" failures.
      - name: Upload release snap to edge and stable
        uses: ./.github/actions/snapcraft-upload
        with:
          snap-dir: .tmp/snap-release
          channels: edge,stable
          store-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          max-attempts: '5'

