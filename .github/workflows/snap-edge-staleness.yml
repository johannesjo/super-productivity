name: Snap Edge Staleness

# `Upload branch snap to edge` in build.yml can only prove the store accepted a
# binary -- and it deliberately passes on that alone, because the review that
# actually moves edge finishes hours later (rev 4501: uploaded 2026-08-26T18:29Z,
# released 2026-08-27T09:58Z). That fail-open is safe because snapcraft submits
# the channel release server-side with the upload, so killing the client cannot
# cancel it; but it does mean nothing in that job notices if edge stops moving.
# This is what notices. Two HTTP calls, no clone, no credentials beyond the
# default token, nothing that can hang.
on:
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily
  # Also on changes to this file: it is only otherwise exercised by the cron,
  # so a mistake in it would sit undetected until the next morning -- and would
  # then look exactly like a real alert.
  push:
    paths:
      - .github/workflows/snap-edge-staleness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Compare snap edge against master
        # Generous: `curl --retry 3` is ~190s worst case and `gh --paginate` is
        # unbounded, so a pathological run must still finish and report rather
        # than be killed into a bare, annotation-less red.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # -f so an API error or a 502 HTML body fails here as "could not
          # check" rather than reaching python and being reported as a stuck
          # edge or a JSON traceback.
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
            -H 'Snap-Device-Series: 16' \
            'https://api.snapcraft.io/v2/snaps/info/superproductivity' \
            -o "$RUNNER_TEMP/snap-info.json"
          python3 - "$RUNNER_TEMP/snap-info.json" <<'PY'
          import datetime, json, os, subprocess, sys

          # Absorbs the ~15.5h store review plus a slow weekend. This assumes
          # review latency stays well under ~40h: it is the unstable variable
          # here (it went from minutes to 15.5h, which is why this file exists),
          # and if it approaches the threshold this goes red on a HEALTHY store,
          # gets muted, and the fail-open it guards is left unguarded. Revisit
          # against observed latency rather than nudging it on a red day.
          MAX_STALE = datetime.timedelta(hours=48)


          def fail(message):
              # print, don't sys.exit(str): workflow commands are only reliably
              # parsed on stdout.
              print(message)
              sys.exit(1)


          # This job has exactly two outcomes a human sees: green, or a red X.
          # So every failure path must say which of "edge is frozen, ship a fix"
          # and "this check could not run" it is -- an opaque red is worse than
          # useless, because it trains the reader to ignore the real one.
          with open(sys.argv[1]) as fh:
              channels = json.load(fh).get("channel-map", [])

          edge = next(
              (
                  entry
                  for entry in channels
                  if entry["channel"].get("architecture") == "amd64"
                  # track too: a versioned track would also carry name 'edge'.
                  and entry["channel"].get("track") == "latest"
                  and entry["channel"]["name"] == "edge"
              ),
              None,
          )
          if edge is None:
              fail("::error::could not read a latest/edge amd64 revision from the channel map")
          if "released-at" not in edge["channel"]:
              fail(f"::error::edge revision {edge.get('revision')} has no released-at")

          released_at = datetime.datetime.fromisoformat(edge["channel"]["released-at"])
          now = datetime.datetime.now(datetime.timezone.utc)
          state = (
              f"edge serves rev {edge['revision']} ({edge['version']}), released "
              f"{released_at.isoformat(timespec='seconds')}"
          )

          # Age the unreleased WORK, not edge itself: edge legitimately sits
          # still through a quiet weekend, so measuring from its release date
          # would alarm on the first commit back from one.
          #
          # Commits older than released_at are excluded by design (not by clock
          # skew -- both clocks are UTC). That is almost always harmless: a
          # later master build is a superset of an earlier one, so a commit
          # whose own snap never uploaded is covered as soon as any later
          # commit's snap lands. The one case that matters -- the last commit
          # before a quiet period -- is caught, because it stays in `pending`
          # until edge moves past it.
          #
          # Detection is bounded at MAX_STALE plus up to the cron interval:
          # a Friday 18:00 commit against a frozen store crosses 48h on Sunday
          # evening and is reported at Monday 06:00.
          #
          # `since` must be whole-second Zulu: the API silently IGNORES a value
          # carrying microseconds or a +00:00 offset and returns the full recent
          # history instead, which would read as a huge backlog and alarm daily.
          # released-at always has microseconds, so normalise -- then re-filter
          # below so correctness does not rest on the API honouring it at all.
          since = released_at.astimezone(datetime.timezone.utc).replace(microsecond=0)
          # --paginate with --jq emits one value per line across all pages.
          # (--slurp cannot be combined with --jq.)
          probe = subprocess.run(
              [
                  "gh", "api", "--paginate",
                  f"repos/{os.environ['GH_REPOSITORY']}/commits"
                  f"?sha=master&since={since.strftime('%Y-%m-%dT%H:%M:%SZ')}&per_page=100",
                  "--jq", ".[].commit.committer.date",
              ],
              capture_output=True,
              text=True,
          )
          if probe.returncode != 0:
              # CalledProcessError drops stderr, which is the only thing that
              # distinguishes a rate limit from a token scope from an outage.
              fail(
                  "::error::could not read master commits from the GitHub API "
                  f"(gh exit {probe.returncode}): {probe.stderr.strip()[:500]}"
              )

          pending = sorted(
              d
              for d in (
                  datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  for raw in probe.stdout.split()
              )
              if d > released_at
          )

          if not pending:
              print(f"{state}; no newer commits on master -- nothing pending.")
              sys.exit(0)

          waiting_h = (now - pending[0]).total_seconds() / 3600
          max_stale_h = MAX_STALE.total_seconds() / 3600
          print(f"{state}; {len(pending)} newer commit(s), oldest waiting {waiting_h:.1f}h.")

          if waiting_h > max_stale_h:
              fail(
                  f"::error::master commits have waited {waiting_h:.0f}h for edge to "
                  f"advance -- the snap store review is likely stuck. {state}"
              )
          print(f"Within the {max_stale_h:.0f}h grace period.")
          PY
