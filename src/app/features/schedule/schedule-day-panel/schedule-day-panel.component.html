<div
  #dropZone
  class="schedule-day-drop-zone"
  (pointerenter)="onDragMove($event)"
  (mousemove)="onDragMove($event)"
  (touchmove)="onDragMove($event)"
  swipeGesture
  [swipeEnabled]="isInBottomSheet && !isDragging()"
  (swipeleft)="goToNextDay()"
  (swiperight)="goToPreviousDay()"
>
  @if (hasNoEvents()) {
    <div class="empty-state">
      <div class="empty-state-text">
        {{ T.F.SCHEDULE.DROP_TASKS_HERE_TO_SCHEDULE | translate }}
      </div>
    </div>
  }
  <schedule-week
    #scheduleWeek
    [isInPanel]="true"
    [events]="events()"
    [beyondBudget]="beyondBudget()"
    [daysToShow]="daysToShow()"
    [todayDateStr]="todayDateStr()"
    [workStartEnd]="workStartEnd() || null"
    [currentTimeRow]="currentTimeRow()"
    [isTaskDragActive]="isDragging()"
  >
    <button
      weekHeaderStart
      mat-icon-button
      [disabled]="isViewingToday()"
      [attr.aria-label]="T.F.SCHEDULE.PREVIOUS_DAY | translate"
      [matTooltip]="T.F.SCHEDULE.PREVIOUS_DAY | translate"
      (click)="goToPreviousDay()"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button
      weekHeaderEnd
      mat-icon-button
      [attr.aria-label]="T.F.SCHEDULE.NEXT_DAY | translate"
      [matTooltip]="T.F.SCHEDULE.NEXT_DAY | translate"
      (click)="goToNextDay()"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </schedule-week>
</div>
